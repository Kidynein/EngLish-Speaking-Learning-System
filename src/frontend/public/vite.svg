<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gradient definitions for each petal -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EAB308;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EAB308;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A3B84C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A3B84C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad5" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad6" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Center point -->
  <circle cx="100" cy="100" r="0" fill="none"/>
  
  <!-- Petal 1 (Top) - Yellow -->
  <path d="M 100 100 Q 100 20 100 10 Q 120 20 110 50 Q 105 75 100 100" 
        fill="url(#grad1)" stroke="none"/>
  <path d="M 100 100 Q 100 20 100 10 Q 80 20 90 50 Q 95 75 100 100" 
        fill="url(#grad1)" stroke="none"/>
  
  <!-- Petal 2 (Top Right) - Yellow-Green -->
  <path d="M 100 100 Q 140 40 155 25 Q 155 50 135 70 Q 115 85 100 100" 
        fill="url(#grad2)" stroke="none"/>
  <path d="M 100 100 Q 130 50 140 40 Q 125 55 115 75 Q 105 90 100 100" 
        fill="url(#grad2)" stroke="none"/>
  
  <!-- Petal 3 (Right) - Green -->
  <path d="M 100 100 Q 165 90 180 95 Q 170 115 145 120 Q 120 110 100 100" 
        fill="url(#grad3)" stroke="none"/>
  <path d="M 100 100 Q 165 110 180 105 Q 170 85 145 80 Q 120 90 100 100" 
        fill="url(#grad3)" stroke="none"/>
  
  <!-- Petal 4 (Bottom Right) - Teal -->
  <path d="M 100 100 Q 140 150 155 170 Q 145 160 130 135 Q 110 115 100 100" 
        fill="url(#grad4)" stroke="none"/>
  <path d="M 100 100 Q 130 140 140 155 Q 125 145 115 125 Q 105 110 100 100" 
        fill="url(#grad4)" stroke="none"/>
  
  <!-- Petal 5 (Bottom) - Blue-Teal -->
  <path d="M 100 100 Q 100 170 100 185 Q 85 170 90 145 Q 95 120 100 100" 
        fill="url(#grad5)" stroke="none"/>
  <path d="M 100 100 Q 100 170 100 185 Q 115 170 110 145 Q 105 120 100 100" 
        fill="url(#grad5)" stroke="none"/>
  
  <!-- Petal 6 (Bottom Left) - Blue -->
  <path d="M 100 100 Q 60 150 45 170 Q 55 155 70 135 Q 85 115 100 100" 
        fill="url(#grad6)" stroke="none"/>
  <path d="M 100 100 Q 70 140 60 155 Q 75 145 85 125 Q 95 110 100 100" 
        fill="url(#grad6)" stroke="none"/>
  
  <!-- Petal 7 (Left) - Green-Teal -->
  <path d="M 100 100 Q 35 110 20 105 Q 30 85 55 80 Q 80 90 100 100" 
        fill="url(#grad4)" stroke="none"/>
  <path d="M 100 100 Q 35 90 20 95 Q 30 115 55 120 Q 80 110 100 100" 
        fill="url(#grad4)" stroke="none"/>
  
  <!-- Petal 8 (Top Left) - Yellow-Green -->
  <path d="M 100 100 Q 60 50 45 30 Q 55 45 70 65 Q 85 85 100 100" 
        fill="url(#grad2)" stroke="none"/>
  <path d="M 100 100 Q 70 60 60 45 Q 75 55 85 75 Q 95 90 100 100" 
        fill="url(#grad2)" stroke="none"/>
  
  <!-- Center circle (white) -->
  <circle cx="100" cy="100" r="25" fill="white"/>
  
  <!-- Microphone icon in center -->
  <g transform="translate(88, 82)">
    <rect x="10" y="4" width="4" height="10" rx="2" fill="#0EA5E9"/>
    <path d="M 12 14 Q 12 18 9 19.5 L 15 19.5 Q 12 18 12 14" fill="#0EA5E9"/>
    <line x1="12" y1="19.5" x2="12" y2="23" stroke="#0EA5E9" stroke-width="1.5"/>
    <line x1="9" y1="23" x2="15" y2="23" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 6 9 Q 4 12 6 15" stroke="#10B981" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 18 9 Q 20 12 18 15" stroke="#10B981" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>